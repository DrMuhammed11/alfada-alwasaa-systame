name: Backend 24/7 KeepAlive
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend Health Endpoint
        run: |
          curl -sS -o /dev/null -w "Status: %{http_code}\n" https://alfada-alwasaa-systame.onrender.com/api/v1/health || true

name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: alfadaa
          POSTGRES_PASSWORD: alfadaa
          POSTGRES_DB: alfadaa_correspondence
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alfadaa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: تثبيت الحزم
        run: npm ci

      - name: توليد Prisma Client
        run: npx prisma generate

      - name: البناء
        run: npm run build

      - name: اختبارات الوحدة
        run: npm test

      - name: اختبارات e2e (قاعدة بيانات اختبارية alfadaa_test)
        run: npm run test:e2e
        env:
          DATABASE_URL: postgresql://alfadaa:alfadaa@localhost:5432/alfadaa_correspondence?schema=public
          JWT_SECRET: ci-secret-for-tests-only
          MAIL_DRIVER: console
